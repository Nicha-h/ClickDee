worker_processes auto;
pid /run/nginx.pid;

events {
    worker_connections 1024;
}

http {
    include       mime.types;
    default_type  application/octet-stream;
    sendfile      on;
    keepalive_timeout 65;
    server_tokens off;

    server {
        listen 8080;
        server_name _;

        root /usr/share/nginx/html;
        index index.html;

        # SPA fallback: unknown paths resolve to index.html for client-side routing
        location / {
            try_files $uri $uri/ /index.html;

            # Security headers for the SPA itself. Scoped to this location on
            # purpose: /api, /static and /docs get theirs from the backend's
            # secureHeaders (backend/src/app.ts), and a server-level CSP here
            # would duplicate them and break Swagger UI's CDN assets.
            # Fonts: Google Fonts @import in frontend/src/index.css. Images and
            # video: Cloudinary/Meta CDNs plus blob: upload previews. The API is
            # same-origin behind this proxy, so connect-src 'self' covers it.
            add_header Content-Security-Policy "default-src 'self'; script-src 'self'; style-src 'self' 'unsafe-inline' https://fonts.googleapis.com; font-src 'self' https://fonts.gstatic.com data:; img-src 'self' data: blob: https:; media-src 'self' blob: https:; connect-src 'self'; frame-ancestors 'none'; base-uri 'self'; form-action 'self'; object-src 'none'" always;
            add_header Strict-Transport-Security "max-age=15552000; includeSubDomains" always;
            add_header X-Frame-Options "DENY" always;
            add_header X-Content-Type-Options "nosniff" always;
            add_header Referrer-Policy "strict-origin-when-cross-origin" always;
            add_header Permissions-Policy "camera=(), microphone=(), geolocation=()" always;
        }

        location /api/ {
            proxy_pass http://127.0.0.1:3000;
            proxy_http_version 1.1;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
        }

        # Backend-hosted static assets (e.g. seed-script placeholder images
        # under backend/static — see backend/src/app.ts's '/static/*' route).
        # MediaAsset.sourceUrl for these stores a relative "/static/..." path
        # specifically so it resolves against whichever origin serves the
        # page (this proxy in production, the frontend's apiBaseUrl-prefixed
        # request in dev) instead of a container-internal, externally
        # unreachable "localhost:3000".
        location /static/ {
            proxy_pass http://127.0.0.1:3000;
            proxy_http_version 1.1;
            proxy_set_header Host $host;
        }

        location = /openapi.json {
            proxy_pass http://127.0.0.1:3000/openapi.json;
        }

        location /docs {
            proxy_pass http://127.0.0.1:3000/docs;
        }
    }
}
