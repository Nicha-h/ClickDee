worker_processes auto;
pid /run/nginx.pid;

events {
    worker_connections 1024;
}

http {
    include       mime.types;
    default_type  application/octet-stream;
    sendfile      on;
    keepalive_timeout 65;

    server {
        listen 8080;
        server_name _;

        root /usr/share/nginx/html;
        index index.html;

        # SPA fallback: unknown paths resolve to index.html for client-side routing
        location / {
            try_files $uri $uri/ /index.html;
        }

        location /api/ {
            proxy_pass http://127.0.0.1:3000;
            proxy_http_version 1.1;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
        }

        # Backend-hosted static assets (e.g. seed-script placeholder images
        # under backend/static — see backend/src/app.ts's '/static/*' route).
        # MediaAsset.sourceUrl for these stores a relative "/static/..." path
        # specifically so it resolves against whichever origin serves the
        # page (this proxy in production, the frontend's apiBaseUrl-prefixed
        # request in dev) instead of a container-internal, externally
        # unreachable "localhost:3000".
        location /static/ {
            proxy_pass http://127.0.0.1:3000;
            proxy_http_version 1.1;
            proxy_set_header Host $host;
        }

        location = /openapi.json {
            proxy_pass http://127.0.0.1:3000/openapi.json;
        }

        location /docs {
            proxy_pass http://127.0.0.1:3000/docs;
        }
    }
}
